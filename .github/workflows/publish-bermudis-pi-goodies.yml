name: Publish bermudis-pi-goodies

on:
  push:
    tags:
      - "bermudis-pi-goodies-v*"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: pi-packages/bermudis-pi-goodies

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the "Environment name" configured for the npm trusted
    # publisher (npmjs.com/package/bermudis-pi-goodies → Trusted Publisher).
    # The OIDC token only carries the environment claim when the job
    # declares it; a mismatch fails publish with 404.
    environment: npm-publish
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Verify release tag
        if: github.event_name == 'push'
        run: |
          tag_version="${GITHUB_REF_NAME#bermudis-pi-goodies-v}"
          package_version="$(node -p "require('./package.json').version")"
          test "$tag_version" = "$package_version" || {
            echo "Tag version $tag_version does not match package version $package_version" >&2
            exit 1
          }

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Publish to npm
        run: npm publish --access public
